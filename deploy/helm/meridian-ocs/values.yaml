# Meridian OCS. Redis and Kafka are NOT part of this chart: a charging system's
# state store and bus are run by their own operators (or as managed services),
# with the durability settings in docs/architecture/07-durability.md.
#
# Values marked REQUIRED have no default on purpose: the chart refuses to
# render until you choose, the same way the services refuse to start. Nothing
# secret belongs here; certificates and keys come from Kubernetes Secrets you
# create (for example with cert-manager) and name below.

image:
  repository: ""        # REQUIRED, e.g. registry.example.com/meridian ; images are <repository>/<service>:<tag>
  tag: ""               # REQUIRED, a release tag or "sha256:<digest>" (build: docker build -f build/Dockerfile --build-arg SERVICE=<service> .)
  pullPolicy: IfNotPresent
  pullSecrets: []       # [{name: regcred}]

# Rendering any component with authentication "off" is refused unless this is
# true. It exists for throwaway development clusters only.
allowInsecure: false

redis:
  addr: ""              # REQUIRED, host:port of the primary the services should use (a Sentinel/operator Service)
  requiredReplicas: 1   # replicas that must acknowledge every commit before the answer (OCS_REDIS_REPLICAS)
  waitTimeout: 25ms
  allowNoReplica: false # start without the required replicas; development only, needs allowInsecure
  # Access control. Redis holds every balance: an open Redis is refused unless allowInsecure.
  username: ""          # ACL user (Redis 6+); empty = the default user
  password:
    secretName: ""      # REQUIRED unless allowInsecure: a Secret holding the password under `key`.
    key: password       # It is mounted as a file and re-read for every new connection, so rotating the
                        # Secret needs no restart (the new password must be accepted by Redis first).
  tls:
    enabled: false      # REQUIRED to be true (or mesh) unless allowInsecure: the connection is encrypted and the server verified
    mesh: false         # a service mesh encrypts the connection instead
    secretName: ""      # Secret with ca.crt (and tls.crt + tls.key when clientCert); empty = the system roots
    serverName: ""      # name to verify in the server certificate; empty = the host of redis.addr
    clientCert: false   # present tls.crt / tls.key from the Secret (a Redis that requires client certificates);
                        # re-read for every handshake, so a renewed certificate needs no restart
identityPrefix: "id:"   # must be the same everywhere
logLevel: info

kafka:
  brokers: ""           # comma separated host:port; REQUIRED by provisioning and by Kafka-fed mediation
  commandsTopic: ""     # empty = the service's default
  eventsTopic: ""
  dlqTopic: ""

# Applied to every pod unless a component overrides it.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile: {type: RuntimeDefault}
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}
terminationGracePeriodSeconds: 30
nodeSelector: {}
tolerations: []
podAnnotations: {}
serviceAccount:
  annotations: {}

# Spread replicas over nodes and zones; a charging path must survive losing either.
spread:
  enabled: true
  zoneKey: topology.kubernetes.io/zone
  whenUnsatisfiable: ScheduleAnyway   # DoNotSchedule for strict placement

networkPolicy:
  enabled: false
  # Peers (standard NetworkPolicyPeer objects) allowed to reach the services' own
  # ports, and the Prometheus peers allowed to scrape the admin port. Both are
  # REQUIRED when enabled: an empty list would silently cut every client off.
  allowFrom: []
  monitoringFrom: []
  # Egress is not restricted by this chart (see README).

serviceMonitor:
  enabled: false        # needs the Prometheus Operator CRDs
  interval: 15s
  labels: {}

# Alert rules (a PrometheusRule, needs the Prometheus Operator CRDs) and a Grafana
# dashboard (a ConfigMap for the Grafana sidecar). Both only use metrics the
# services export; see docs/architecture/12-deployment.md for what each alert means.
alerts:
  enabled: false
  labels: {}                         # e.g. {release: kube-prometheus-stack}
  latencyP99Seconds: 0.010           # the charging path's P99 target
  latencyP99CriticalSeconds: 0.050
  provisioningLagP99Seconds: 30      # acceptance to recorded outcome
  catalogStaleSeconds: 300           # time since a node last read the shared catalog
  rejectRatio: 0.01                  # share of mediation records in suspense or rejected
  approvalWaitSeconds: 14400         # a provisioning request waiting this long for approval
  unsettledBacklogSeconds: 600       # usage released without being charged has waited this long unreconciled
dashboard:
  enabled: false
  labels: {grafana_dashboard: "1"}   # the label your Grafana sidecar selects on

gateway:
  enabled: true
  replicas: 3
  resources:
    requests: {cpu: "1", memory: 512Mi}
    limits: {memory: 1Gi}    # no CPU limit: throttling shows up as latency on a charging path
  maxTps: 0                  # admission rate limit for the whole pod, 0 = unlimited
  maxInflight: 10000
  # Usage reported in a terminate that arrives while Redis is down is acknowledged (so the network can release the
  # session) and kept here, then charged when Redis returns (docs/architecture/03-rating-engine.md).
  unsettledSpool:
    mode: ""                 # REQUIRED: "persistent" (a volume per pod: the gateway becomes a StatefulSet) | "emptyDir" (survives a container restart, NOT a replaced pod or a lost node) | "off" (that usage is lost; development only)
    sizeLimit: 256Mi         # emptyDir
    persistence:             # persistent
      size: 1Gi
      storageClass: ""       # empty = the cluster default
    peerMayRepeat: false     # true if a network element may report a refused update's usage again under a new request number: it is then kept for a person once the session moved on, not charged (doc 03)
  tariff: static             # static | catalog
  defaultPlan: ""            # REQUIRED when tariff=catalog
  cashBytesRate: ""          # static tariff num/den; empty = the gateway's default
  planCacheTTL: ""
  region: r1
  identity:
    mode: directory          # directory | direct
    cacheTTL: ""
    onConflict: ""           # reject | prefer-first; empty = reject
  diameter:
    enabled: true
    port: 3868
    realm: ""                # REQUIRED when enabled, the Diameter realm
    originHostSuffix: ""     # REQUIRED when enabled; each pod is <pod-name>.<suffix>, e.g. ocs.example.net
    service:
      type: ClusterIP        # LoadBalancer / NodePort for peers outside the cluster
      annotations: {}
      loadBalancerIP: ""
      externalTrafficPolicy: ""
  nchf:
    enabled: true
    port: 8000
    oauth: ""                # REQUIRED: "required" or "off"
    tls:
      secretName: ""         # REQUIRED unless the mesh terminates TLS (then set tls.mesh=true)
      mesh: false
      requireClientCert: false   # mount ca.crt from the secret and demand client certificates
    oauthKeys:
      secretName: ""         # Secret with the NRF access-token signing certificate(s); REQUIRED with oauth=required
      key: nrf.pem
    audience: ""             # comma separated; empty = the gateway's default (CHF)
    issuers: ""
    scope: ""
    nfInstanceId: ""
    service:
      type: ClusterIP
      annotations: {}
  control:                   # guarded AI Ops control plane (docs/architecture/11-aiops.md)
    enabled: false
    port: 9445
    auth: ""                 # REQUIRED when enabled: mtls | off
    tls: {secretName: ""}
    agents: []               # certificate common names
    approvers: []
  autoscaling:
    enabled: false
    minReplicas: 3
    maxReplicas: 12
    targetCPUUtilizationPercentage: 60
  pdb: {maxUnavailable: 1}

provisioning:
  enabled: true
  auth: ""                   # REQUIRED: mtls | off
  tls: {secretName: ""}      # Secret with tls.crt, tls.key and ca.crt (the client CA); REQUIRED with mtls
  currency: ""               # REQUIRED, e.g. EUR
  clients: []                # certificate common names of standard callers; empty = any client of the CA
  privileged: []             # may adjust balances, remove buckets and change lifecycle state
  # Two-person approval (docs/architecture/08-provisioning.md). A privileged command that matches the policy
  # waits until a DIFFERENT authorised person approves exactly what was requested.
  approval:
    policy: ""               # REQUIRED: "off", or rules such as adjust_balance>5000,change_lifecycle:terminated,remove_bucket
    approvers: []            # certificate common names that may approve and reject without being privileged
    ttl: ""                  # how long a request waits (default 24h)
    allowSelf: false         # a requester may approve their own request: development with auth "off" only
  maxTopUp: ""
  maxAdjust: ""
  workers: ""
  graceSweep: ""             # "off" (default) or how often to suspend subscribers whose grace period has ended, e.g. 30s (worker pods)
  restPort: 8443
  grpcPort: 9443
  split: true                # separate API and worker Deployments (OCS_PROV_MODE=api / worker)
  api:
    replicas: 2
    resources: {requests: {cpu: 250m, memory: 256Mi}, limits: {memory: 512Mi}}
    service: {type: ClusterIP, annotations: {}}
  worker:
    replicas: 2
    resources: {requests: {cpu: 250m, memory: 256Mi}, limits: {memory: 512Mi}}
  pdb: {maxUnavailable: 1}

catalog:
  enabled: true
  auth: ""                   # REQUIRED: mtls | off
  tls: {secretName: ""}
  publishers: []             # certificate common names allowed to publish; REQUIRED with mtls
  retain: ""
  resync: ""
  port: 8444
  replicas: 2
  resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {memory: 256Mi}}
  service: {type: ClusterIP, annotations: {}}
  pdb: {maxUnavailable: 1}

mediation:
  enabled: false
  # One pod: the ledger that makes output exactly-once is per output directory.
  resources: {requests: {cpu: 250m, memory: 256Mi}, limits: {memory: 1Gi}}
  persistence:
    size: 20Gi
    storageClass: ""
  input:
    enabled: true            # watch /data/in for CDR files (mount it from your file transfer, or write to it through a sidecar)
  kafka:
    enabled: false           # consume normalized JSON CDRs; needs kafka.brokers
    topic: ""
    group: ""
  scanInterval: ""
  settle: ""
  maxFileBytes: ""
  dedupWindow: ""
  rating: "off"              # off | catalog
  defaultPlan: ""            # REQUIRED with rating=catalog
  mapping: ""                # inline YAML/JSON mapping (pkg/mapping); hot-reloaded when the ConfigMap changes
  mappingReload: ""
  cdrMapping: ""             # inline JSON overriding the PGW BER field mapping

aiops:
  enabled: false
  auth: ""                   # REQUIRED when enabled: mtls | off
  tls: {secretName: ""}
  port: 8445
  replicas: 2
  resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 128Mi}}
  service: {type: ClusterIP, annotations: {}}
  pdb: {maxUnavailable: 1}
