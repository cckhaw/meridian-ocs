{{- if .Values.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-dashboard
  labels:
    app.kubernetes.io/part-of: meridian-ocs
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- with .Values.dashboard.labels }}{{ toYaml . | nindent 4 }}{{- end }}
data:
  meridian-ocs.json: |
    {{- .Files.Get "files/dashboard.json" | nindent 4 }}
{{- end }}
