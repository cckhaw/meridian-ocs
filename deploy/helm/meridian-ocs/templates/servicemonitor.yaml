{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/part-of: meridian-ocs
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- with .Values.serviceMonitor.labels }}{{ toYaml . | nindent 4 }}{{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: meridian-ocs
      app.kubernetes.io/instance: {{ .Release.Name }}
      ocs.meridian/admin: "true"
  endpoints:
    - {port: admin, path: /metrics, interval: {{ .Values.serviceMonitor.interval }}}
{{- end }}
