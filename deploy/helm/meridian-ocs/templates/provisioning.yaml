{{- if .Values.provisioning.enabled }}
{{- $p := .Values.provisioning }}
{{- $auth := include "ocs.auth" (dict "root" . "what" "provisioning.auth" "value" $p.auth) }}
{{- $_ := required "provisioning.currency is required (the deployment currency, e.g. EUR)" $p.currency }}
{{- $_ := required "kafka.brokers is required by provisioning" .Values.kafka.brokers }}
{{- if eq $auth "mtls" }}
{{- if not $p.tls.secretName }}{{ fail "provisioning.auth=mtls needs provisioning.tls.secretName (tls.crt, tls.key and ca.crt, the client CA)" }}{{ end }}
{{- if not (or $p.clients $p.privileged) }}{{ fail "provisioning.auth=mtls needs provisioning.clients and/or provisioning.privileged: with neither, every client of the CA could change subscribers" }}{{ end }}
{{- else if or $p.clients $p.privileged }}{{ fail "provisioning.clients/privileged have no effect with auth=off: refusing a configuration that looks restricted but is not" }}
{{- end }}
{{- $ap := $p.approval }}
{{- if not $ap.policy }}{{ fail "provisioning.approval.policy is required: \"off\", or the rules that need a second person's approval, for example adjust_balance>5000,change_lifecycle:terminated,remove_bucket" }}{{ end }}
{{- if ne $ap.policy "off" }}
{{- range (splitList "," $ap.policy) }}
{{- if not (regexMatch "^ *(adjust_balance(>[0-9]+)?|change_lifecycle(:(active|grace|suspended|terminated)(\\|(active|grace|suspended|terminated))*)?|remove_bucket) *$" .) }}{{ fail (printf "provisioning.approval.policy: unknown rule %q (want adjust_balance[>N], change_lifecycle[:state|state], remove_bucket)" .) }}{{ end }}
{{- end }}
{{- if eq $auth "mtls" }}
{{- if lt (len (uniq (concat ($p.privileged | default list) ($ap.approvers | default list)))) 2 }}{{ fail "provisioning.approval needs at least two different callers who can approve (provisioning.privileged and provisioning.approval.approvers together): otherwise nobody could ever approve a request" }}{{ end }}
{{- else if not $ap.allowSelf }}{{ fail "provisioning.approval with provisioning.auth=off: every caller is the same person, so nobody could approve a request; set provisioning.approval.allowSelf=true to try the flow in development" }}
{{- end }}
{{- else }}
{{- if or $ap.approvers $ap.allowSelf }}{{ fail "provisioning.approval.approvers and allowSelf have no effect with policy \"off\": refusing a configuration that looks restricted but is not" }}{{ end }}
{{- end }}
{{- if and $ap.allowSelf (eq $auth "mtls") }}{{ fail "provisioning.approval.allowSelf is refused with provisioning.auth=mtls: it would let one person approve their own request" }}{{ end }}
{{- if and $ap.approvers (eq $auth "off") }}{{ fail "provisioning.approval.approvers has no effect with provisioning.auth=off" }}{{ end }}
{{- $vols := list }}{{- $mounts := list }}
{{- if eq $auth "mtls" }}
{{- $vols = append $vols (dict "name" "tls" "secret" (dict "secretName" $p.tls.secretName "defaultMode" 288)) }}
{{- $mounts = append $mounts (dict "name" "tls" "mountPath" "/tls" "readOnly" true) }}
{{- end }}
{{- $roles := list }}
{{- if $p.split }}{{ $roles = list (dict "name" "provisioning-api" "mode" "api" "cfg" $p.api) (dict "name" "provisioning-worker" "mode" "worker" "cfg" $p.worker) }}{{ else }}{{ $roles = list (dict "name" "provisioning" "mode" "all" "cfg" $p.api) }}{{ end }}
{{- range $roles }}
{{- $role := . }}
{{- $ports := list }}
{{- if ne $role.mode "worker" }}{{ $ports = list (dict "name" "rest" "port" $p.restPort) (dict "name" "grpc" "port" $p.grpcPort) }}{{ end }}
{{- $env := include "provisioning.env" (dict "root" $ "mode" $role.mode) }}
{{ include "ocs.component" (dict "redis" true "root" $ "name" $role.name "service" "ocs-provisioning-service" "kind" "Deployment"
    "replicas" $role.cfg.replicas "resources" $role.cfg.resources "ports" $ports "env" $env
    "volumes" (ternary (toYaml $vols) "" (gt (len $vols) 0)) "mounts" (ternary (toYaml $mounts) "" (gt (len $mounts) 0))
    "pdb" $p.pdb) }}
{{- if ne $role.mode "worker" }}
---
{{ include "ocs.service" (dict "root" $ "name" $role.name "svc" $p.api.service "ports" (list (dict "name" "rest" "port" $p.restPort) (dict "name" "grpc" "port" $p.grpcPort))) }}
{{- end }}
{{- end }}
{{- end }}
