{{- if .Values.catalog.enabled }}
{{- $c := .Values.catalog }}
{{- $auth := include "ocs.auth" (dict "root" . "what" "catalog.auth" "value" $c.auth) }}
{{- if eq $auth "mtls" }}
{{- if not $c.tls.secretName }}{{ fail "catalog.auth=mtls needs catalog.tls.secretName (tls.crt, tls.key and ca.crt)" }}{{ end }}
{{- if not $c.publishers }}{{ fail "catalog.auth=mtls needs catalog.publishers: at least one client allowed to publish" }}{{ end }}
{{- else if $c.publishers }}{{ fail "catalog.publishers has no effect with auth=off: refusing a configuration that looks restricted but is not" }}
{{- end }}
{{- $vols := list }}{{- $mounts := list }}
{{- if eq $auth "mtls" }}
{{- $vols = append $vols (dict "name" "tls" "secret" (dict "secretName" $c.tls.secretName "defaultMode" 288)) }}
{{- $mounts = append $mounts (dict "name" "tls" "mountPath" "/tls" "readOnly" true) }}
{{- end }}
{{- $env := include "catalog.env" . }}
{{ include "ocs.component" (dict "root" . "name" "catalog" "service" "ocs-catalog-service" "kind" "Deployment"
    "replicas" $c.replicas "resources" $c.resources "ports" (list (dict "name" "rest" "port" $c.port)) "env" $env
    "volumes" (ternary (toYaml $vols) "" (gt (len $vols) 0)) "mounts" (ternary (toYaml $mounts) "" (gt (len $mounts) 0))
    "pdb" $c.pdb) }}
---
{{ include "ocs.service" (dict "root" . "name" "catalog" "svc" $c.service "ports" (list (dict "name" "rest" "port" $c.port))) }}
{{- end }}
