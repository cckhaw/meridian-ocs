# promtool unit tests for the alert rules: the alerts that matter most fire when
# they should and stay quiet when they should. Run by test.sh.
rule_files: [rules.yaml]
evaluation_interval: 1m
tests:
  - name: serving degraded
    interval: 1m
    input_series:
      - series: 'ocs_engine_degraded_total{pod="g0"}'
        values: '0+0x5 0+30x10'
    alert_rule_test:
      - {eval_time: 4m, alertname: OcsServingDegraded, exp_alerts: []}
      - eval_time: 10m
        alertname: OcsServingDegraded
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: "Requests are being answered without the data tier"
              description: "The fail policy is answering instead of the balance store (prepaid fail-closed, postpaid fail-open with caps). Redis is unreachable or slow."

  - name: usage released without being charged
    interval: 1m
    input_series:
      - series: 'ocs_engine_unsettled_terminates_total{pod="g0"}'
        values: '0+0x5 0+1x3 3+0x10'
    alert_rule_test:
      - {eval_time: 4m, alertname: OcsUsageNotSettled, exp_alerts: []}
      - eval_time: 7m
        alertname: OcsUsageNotSettled
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "Sessions were released while the data tier was down; their last usage awaits charging"
              description: "A terminate arrived while Redis was unavailable and was acknowledged. Its usage is kept in the gateway's spool and is charged when Redis returns; OcsUnsettledUsageBacklog and OcsUnsettledUsageLost say if that is not happening."
      - {eval_time: 20m, alertname: OcsUsageNotSettled, exp_alerts: []}

  - name: unsettled usage is not draining
    interval: 1m
    input_series:
      # waiting 100 s at minute 4, then older and older: past the 600 s limit from minute 10, and for 5 minutes by minute 15
      - series: 'ocs_unsettled_oldest_age_seconds{pod="g0"}'
        values: '0+0x3 100+100x20'
    alert_rule_test:
      - {eval_time: 8m, alertname: OcsUnsettledUsageBacklog, exp_alerts: []}   # 500 s: under the 600 s limit
      - eval_time: 16m
        alertname: OcsUnsettledUsageBacklog
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: "Usage released without being charged has been waiting for over 10 minutes"
              description: "The reconciler is not draining the gateway's spool: Redis is still unavailable, the circuit breaker is held open, or replays are failing. The usage is on disk and will be charged once it can be."

  - name: unsettled usage that can no longer be recovered
    interval: 1m
    input_series:
      - series: 'ocs_engine_unsettled_unrecorded_total{pod="g0"}'
        values: '0+0x3 0+1x3 3+0x14'
      - series: 'ocs_unsettled_dead_total{pod="g0"}'
        values: '0+0x20'
    alert_rule_test:
      - {eval_time: 2m, alertname: OcsUnsettledUsageLost, exp_alerts: []}
      - eval_time: 6m
        alertname: OcsUnsettledUsageLost
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: "Usage was released without being charged and can no longer be recovered"
              description: "Either the spool is off or could not be written (ocs_engine_unsettled_unrecorded_total), or a recorded terminate belonged to a session that no longer exists (ocs_unsettled_dead_total; the records are kept as dead letters in the spool). That usage is revenue not charged."
      - {eval_time: 19m, alertname: OcsUnsettledUsageLost, exp_alerts: []}

  - name: a commit acknowledged by too few replicas
    interval: 1m
    input_series:
      - series: 'ocs_durability_short_total{pod="g0"}'
        values: '0+0x3 0+1x10'
      - series: 'ocs_engine_unreplicated_total{pod="g0"}'
        values: '0+0x13'
    alert_rule_test:
      - {eval_time: 2m, alertname: OcsCommitsNotReplicated, exp_alerts: []}
      - eval_time: 8m
        alertname: OcsCommitsNotReplicated
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: "Commits are being acknowledged by fewer replicas than required"
              description: "The no-double-spend durability promise is weakened: a primary failure now could lose charges. A replica is lagging, partitioned or down."

  - name: provisioning accepts commands but none finish
    interval: 1m
    input_series:
      - series: 'ocs_prov_submissions_total{result="accepted",pod="a0"}'
        values: '0+5x30'
      - series: 'ocs_prov_commands_total{outcome="applied",pod="w0"}'
        values: '0+0x30'
    alert_rule_test:
      - {eval_time: 5m, alertname: OcsProvisioningStalled, exp_alerts: []}
      - eval_time: 25m
        alertname: OcsProvisioningStalled
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: "Provisioning commands are accepted but none finish"
              description: "The workers are not consuming: Kafka, Redis or the worker pods are down."

  - name: provisioning keeping up is quiet
    interval: 1m
    input_series:
      - series: 'ocs_prov_submissions_total{result="accepted",pod="a0"}'
        values: '0+5x30'
      - series: 'ocs_prov_commands_total{outcome="applied",pod="w0"}'
        values: '0+5x30'
    alert_rule_test:
      - {eval_time: 25m, alertname: OcsProvisioningStalled, exp_alerts: []}

  - name: nodes on different catalog versions
    interval: 1m
    input_series:
      - series: 'ocs_catalog_version_in_effect{pod="g0"}'
        values: '4x30'
      - series: 'ocs_catalog_version_in_effect{pod="g1"}'
        values: '3x30'
    alert_rule_test:
      - {eval_time: 10m, alertname: OcsCatalogVersionSkew, exp_alerts: []}
      - eval_time: 20m
        alertname: OcsCatalogVersionSkew
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "Nodes disagree about which catalog version is in effect"
              description: "A publish has not reached every node, or a node is stuck. Different nodes are pricing differently."

  - name: nodes on one catalog version are quiet
    interval: 1m
    input_series:
      - series: 'ocs_catalog_version_in_effect{pod="g0"}'
        values: '4x30'
      - series: 'ocs_catalog_version_in_effect{pod="g1"}'
        values: '4x30'
    alert_rule_test:
      - {eval_time: 25m, alertname: OcsCatalogVersionSkew, exp_alerts: []}

  - name: slow charging (all requests in the 25 ms bucket)
    interval: 1m
    input_series:
      - series: 'ocs_engine_rate_duration_seconds_bucket{le="0.01",pod="g0"}'
        values: '0x30'
      - series: 'ocs_engine_rate_duration_seconds_bucket{le="0.025",pod="g0"}'
        values: '0+600x30'
      - series: 'ocs_engine_rate_duration_seconds_bucket{le="+Inf",pod="g0"}'
        values: '0+600x30'
    alert_rule_test:
      - {eval_time: 5m, alertname: OcsChargingLatencyHigh, exp_alerts: []}
      - eval_time: 20m
        alertname: OcsChargingLatencyHigh
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "Charging P99 latency is above 10 ms"
              description: "Rating P99 over 5 minutes is 24.85ms. The target is 10 ms."

  - name: fast charging is quiet (everything under 1 ms)
    interval: 1m
    input_series:
      - series: 'ocs_engine_rate_duration_seconds_bucket{le="0.001",pod="g0"}'
        values: '0+600x30'
      - series: 'ocs_engine_rate_duration_seconds_bucket{le="0.01",pod="g0"}'
        values: '0+600x30'
      - series: 'ocs_engine_rate_duration_seconds_bucket{le="+Inf",pod="g0"}'
        values: '0+600x30'
    alert_rule_test:
      - {eval_time: 25m, alertname: OcsChargingLatencyHigh, exp_alerts: []}

  - name: a request waiting too long for approval
    interval: 1m
    input_series:
      - series: 'ocs_prov_approvals_oldest_age_seconds{pod="p0"}'
        values: '0+600x40'     # ages by ten minutes a minute: crosses 4 hours (14400 s) after 24 minutes
    alert_rule_test:
      - {eval_time: 10m, alertname: OcsApprovalWaiting, exp_alerts: []}
      - eval_time: 35m
        alertname: OcsApprovalWaiting
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "A provisioning request has waited a long time for approval"
              description: "A privileged change (balance correction, bucket removal or termination) has been waiting for a second person for more than 4 hours. It expires if nobody decides."

  - name: an attempt to approve one's own request
    interval: 1m
    input_series:
      - series: 'ocs_prov_approvals_total{result="refused_self",pod="p0"}'
        values: '0 0 0 1 1 1 1 1'
    alert_rule_test:
      - {eval_time: 2m, alertname: OcsSelfApprovalAttempted, exp_alerts: []}
      - eval_time: 5m
        alertname: OcsSelfApprovalAttempted
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "Someone tried to approve their own request"
              description: "The attempt was refused. Look for a shared certificate or a person using two identities."
