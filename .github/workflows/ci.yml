name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Install Redis (integration tests)
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: make fmt vet build test
        env:
          OCS_REQUIRE_REDIS: "1"
