version: v2
# Plugins are the locally installed protoc-gen-go and protoc-gen-go-grpc (see
# `make proto-tools`), so generation needs no network access.
plugins:
  - local: protoc-gen-go
    out: ../../pkg/gen
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: ../../pkg/gen
    opt: paths=source_relative
